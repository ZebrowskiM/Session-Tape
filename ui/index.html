<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Session Tape</title>
  <link rel="stylesheet" href="./style.css">
  <script src="../dist/renderer.js" defer></script>
</head>
<body>
  <header>
    <div class="wordmark"><img src="../session-tape-mark.svg" alt=""><span>Session Tape</span></div>
    <button type="button" id="switch" class="quiet">Open panel</button>
  </header>
  <main>
    <h1 id="heading">Session archive</h1>
    <section class="desk" aria-label="Session controls">
      <form id="start-form" hidden>
        <label for="title">Start a session</label>
        <div class="row"><input id="title" maxlength="120" placeholder="Session title" required><button>Start</button></div>
      </form>
      <div id="session" hidden>
        <div class="session-head"><h2 id="session-name"></h2><button type="button" id="finish" class="quiet">Finish session</button></div>
        <div class="phase-controls"><span id="phase-name"></span><button type="button" id="change-phase" class="quiet">Pause</button></div>
      </div>
      <form id="note-form" hidden>
        <label for="note">Quick note</label>
        <textarea id="note" maxlength="16000" rows="3" placeholder="What did you try or decide?" required></textarea>
        <div class="note-actions"><span id="shortcut"></span><button type="button" id="clear-draft" class="quiet" hidden>Clear draft</button><button id="save-note">Save note</button></div>
      </form>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="archive" aria-label="Saved notes">
      <div class="archive-head"><h2>Saved notes</h2><label class="sr-only" for="search">Search notes and session titles</label>
      <input id="search" maxlength="200" type="search" placeholder="Search notes and sessions"></div>
      <ol id="notes"></ol><p id="empty" hidden></p>
    </section>
  </main>
</body>
</html>
